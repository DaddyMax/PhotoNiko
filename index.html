            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 15px;

            transform: translateY(-2px);

            font-weight: bold;

            border-radius: 6px;
            margin-bottom: 40px;
            transition: background-color 0.2s, transform 0.1s;

        }
        .download-btn:hover {
            background-color: #0051d5;
            transform: translateY(-2px);
        }

        /* Адаптивная сетка для фоток разной ориентации */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #181818;
            min-height: 250px; /* Минимальная высота контейнера */
            transition: transform 0.2s;
        }
        .item:hover {
            transform: scale(1.01);
        }
        .gallery img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain; /* Сохраняет пропорции: и вертикальные, и горизонтальные влезут целиком без обрезки */

        const gallery = document.getElementById('image-gallery');

        photos.forEach(photo => {
            const item = document.createElement('div');
            item.className = 'item';
            
            const img = document.createElement('img');
            img.src = photo.thumb;
            img.loading = "lazy";
            
            // По клику файл начнет скачиваться с оригинальным именем из Google Диска
            img.onclick = () => window.open(photo.original, '_blank');

            item.appendChild(img);
            gallery.appendChild(item);
        });

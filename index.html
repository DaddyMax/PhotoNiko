        /* Сетка для плитки */

            margin: 0 auto;
            text-align: left;
        }
        .item {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .item:hover {
            transform: scale(1.02);
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

            img.src = url;
            img.loading = "lazy"; // Ленивая загрузка для быстрой работы страницы
            
            // При клике картинка открывается в новом окне в оригинальном разрешении
            img.onclick = () => window.open(url, '_blank');

            item.appendChild(img);
            gallery.appendChild(item);
        });
    </script>

</body>
</html>
